[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomusyo"
version = "0.1.0"
description = "Daily news digest bot posting to a Discord webhook"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0,<7",
    "anthropic>=2.3,<3",
    "requests>=2.31,<3",
    "discord.py>=2.4,<3",
    "tzdata>=2024.1,<2027",
    "python-dateutil>=2.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
    "pip-audit>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nomusyo.storage" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
